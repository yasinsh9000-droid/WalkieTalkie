name: Build Walkie Talkie

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip WalkieTalkie-Fabric-1.21.4-source.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1

      - name: Build Mod
        working-directory: walkie-talkie-fabric
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-JAR
          path: walkie-talkie-fabric/build/libs/*.jar
